<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>综艺 - 飘雪</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="navbar" id="navbar">
    <div class="nav-inner">
      <a class="logo" href="../index.html">飘<span>雪</span></a>
      <nav class="nav-links">
        <a href="../index.html">首页</a>
        <a href="variety.html" class="">电影</a>
        <a href="tv.html">剧集</a>
        <a href="anime.html">动漫</a>
        <a href="variety.html" class="active">综艺</a>
      </nav>
      <div class="nav-right">
        <button class="search-btn" onclick="toggleSearch()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <div id="userArea"></div>
      </div>
    </div>
    <div class="search-bar" id="searchBar">
      <input type="text" id="searchInput" placeholder="搜索综艺…" onkeydown="if(event.key==='Enter')doSearch()" />
      <button onclick="doSearch()">搜索</button>
      <button class="close-search" onclick="toggleSearch()">✕</button>
    </div>
  </header>

  <div class="page-header">
    <div class="page-header-inner">
      <h1>🎉 综艺</h1>
      <div class="filter-bar">
        <div class="filter-group" id="yearFilter">
          <button class="filter-btn active" data-val="" onclick="setFilter('year','',this)">全部</button>
          <button class="filter-btn" data-val="2025" onclick="setFilter('year','2025',this)">2025</button>
          <button class="filter-btn" data-val="2024" onclick="setFilter('year','2024',this)">2024</button>
          <button class="filter-btn" data-val="2023" onclick="setFilter('year','2023',this)">2023</button>
          <button class="filter-btn" data-val="2022" onclick="setFilter('year','2022',this)">2022</button>
        </div>
      </div>
    </div>
  </div>

  <div class="page-content">
    <div class="card-grid" id="contentGrid"></div>
    <div id="statusMsg" style="text-align:center;padding:20px;color:var(--text-muted);font-size:.85rem;display:none"></div>
    <button class="load-more" id="loadMoreBtn" onclick="loadMore()" style="display:none">加载更多</button>
  </div>

  <!-- 弹窗 -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h2>登录 / 注册</h2>
      <p class="modal-sub">登录后可保存观看历史和收藏</p>
      <input type="text" id="inputUsername" placeholder="用户名" maxlength="16" />
      <input type="password" id="inputPassword" placeholder="密码" maxlength="32" />
      <div class="modal-btns">
        <button onclick="doLogin()">登录</button>
        <button class="btn-reg" onclick="doRegister()">注册</button>
      </div>
    </div>
  </div>
  <div class="modal-overlay" id="settingsModal">
    <div class="modal settings-modal">
      <button class="modal-close" onclick="closeSettings()">✕</button>
      <h2>个人设置</h2>
      <div class="settings-avatar" id="settingsAvatar"></div>
      <div class="setting-item"><label>显示名称</label><input type="text" id="setNickname" placeholder="昵称" /></div>
      <div class="setting-item"><label>主题风格</label><div id="themePicker"></div></div>
      <div class="setting-item"><label>默认视频源</label>
        <select id="defaultSource">
          <option value="0">线路一</option><option value="1">线路二</option>
          <option value="2">线路三</option><option value="3">线路四</option>
        </select>
      </div>
      <div class="settings-actions">
        <button onclick="saveSettings()">保存</button>
        <button class="btn-danger" onclick="doLogout()">退出登录</button>
      </div>
      <div class="watch-history"><h3>观看历史</h3><div id="historyList"></div><button class="btn-clear" onclick="clearHistory()">清除历史</button></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <nav class="mobile-nav">
    <a href="../index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>首页</a>
    <a href="variety.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/></svg>电影</a>
    <a href="tv.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2"/><polyline points="17 2 12 7 7 2"/></svg>剧集</a>
    <a href="anime.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>动漫</a>
    <a href="search.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>搜索</a>
  </nav>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    const TYPE = 'variety';
    let currentPage = 1;
    let currentFilter = '';
    let isLoading = false;
    let hasMore = true;

    function buildCard(item) {
      const id=item.vod_id, name=item.vod_name||'', pic=item.vod_pic||'';
      const year=item.vod_year||'', score=item.vod_score||'', tag=item.vod_remarks||'';
      return `<div class="card" onclick="location.href='detail.html?id=${id}'">
        <div class="card-thumb">
          ${pic?`<img src="${pic}" loading="lazy" onerror="this.style.display='none'">`:''}
          ${!pic?`<div class="no-img">🎬</div>`:''}
          ${score?`<span class="card-score">⭐${score}</span>`:''}
          ${tag?`<span class="card-tag">${tag}</span>`:''}
          <div class="card-play-overlay"><svg viewBox="0 0 24 24" fill="currentColor" width="40" height="40"><path d="M8 5v14l11-7z"/></svg></div>
        </div>
        <div class="card-info">
          <div class="card-title">${name}</div>
          <div class="card-meta">${year}</div>
        </div>
      </div>`;
    }

    function showSkeletons() {
      const grid = document.getElementById('contentGrid');
      grid.innerHTML = Array(12).fill(`
        <div class="skeleton" style="border-radius:10px">
          <div class="skeleton" style="aspect-ratio:2/3;border-radius:10px 10px 0 0"></div>
          <div class="skeleton" style="height:12px;margin:10px 8px 4px;border-radius:4px"></div>
          <div class="skeleton" style="height:10px;width:60%;margin:0 8px 10px;border-radius:4px"></div>
        </div>`).join('');
    }

    function setStatus(msg) {
      const el = document.getElementById('statusMsg');
      el.style.display = msg ? 'block' : 'none';
      el.textContent = msg;
    }

    async function loadContent(page=1, append=false) {
      if (isLoading) return;
      isLoading = true;
      const grid = document.getElementById('contentGrid');
      const btn  = document.getElementById('loadMoreBtn');

      if (!append) { showSkeletons(); setStatus(''); btn.style.display='none'; }

      try {
        const data = await API.getList(TYPE, page, currentFilter);
        const items = data.list || [];

        if (!items.length) {
          if (!append) {
            grid.innerHTML = '';
            setStatus('暂无内容，正在尝试其他数据源…');
            // 自动重试换源
            setTimeout(() => retryWithNextSource(page), 1500);
          }
          isLoading = false;
          return;
        }

        setStatus('');
        const html = items.map(buildCard).join('');
        if (append) grid.insertAdjacentHTML('beforeend', html);
        else grid.innerHTML = html;

        hasMore = items.length >= 20;
        btn.style.display = hasMore ? 'block' : 'none';

      } catch(e) {
        console.error('加载失败:', e);
        if (!append) {
          grid.innerHTML = '';
          setStatus('⚠️ 加载失败，请刷新重试');
        }
      }
      isLoading = false;
    }

    // 自动换源重试（最多尝试5次）
    let retryCount = 0;
    async function retryWithNextSource(page) {
      if (retryCount >= 5) {
        setStatus('⚠️ 所有数据源均无电影内容，请稍后刷新');
        retryCount = 0;
        return;
      }
      retryCount++;
      setStatus(`暂无内容，正在尝试第 ${retryCount + 1} 条数据源…`);
      // 通过修改偏好源触发不同的源
      API._overrideSrc = retryCount;
      try {
        const data = await API.getList(TYPE, page, currentFilter);
        const items = data.list || [];
        if (!items.length) {
          setTimeout(() => retryWithNextSource(page), 1000);
          return;
        }
        retryCount = 0;
        API._overrideSrc = null;
        setStatus('');
        document.getElementById('contentGrid').innerHTML = items.map(buildCard).join('');
        const hasMore = items.length >= 20;
        document.getElementById('loadMoreBtn').style.display = hasMore ? 'block' : 'none';
      } catch(e) {
        setTimeout(() => retryWithNextSource(page), 1000);
      }
    }

    function loadMore() {
      currentPage++;
      loadContent(currentPage, true);
    }

    function setFilter(type, val, el) {
      currentPage = 1; retryCount = 0;
      currentFilter = val;
      document.querySelectorAll(`#${type}Filter .filter-btn`).forEach(b=>b.classList.remove('active'));
      el.classList.add('active');
      loadContent(1, false);
    }

    function toggleSearch() {
      const bar = document.getElementById('searchBar');
      bar.classList.toggle('open');
      if (bar.classList.contains('open')) document.getElementById('searchInput')?.focus();
    }
    function doSearch() {
      const kw = document.getElementById('searchInput')?.value?.trim();
      if (kw) location.href = 'search.html?q=' + encodeURIComponent(kw);
    }
    function toDetail(id) { location.href = 'detail.html?id=' + id; }

    document.addEventListener('DOMContentLoaded', () => { loadContent(1); });
  </script>
</body>
</html>
