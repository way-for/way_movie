<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>搜索 - 映巢</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="navbar" id="navbar">
    <div class="nav-inner">
      <a class="logo" href="../index.html">映<span>巢</span></a>
      <nav class="nav-links">
        <a href="../index.html">首页</a>
        <a href="movie.html">电影</a>
        <a href="tv.html">剧集</a>
        <a href="anime.html">动漫</a>
        <a href="variety.html">综艺</a>
      </nav>
      <div class="nav-right">
        <div id="userArea"></div>
      </div>
    </div>
    <!-- 搜索栏始终展开 -->
    <div class="search-bar open" id="searchBar">
      <input type="text" id="searchInput" placeholder="搜索电影、剧集、动漫…" onkeydown="if(event.key==='Enter')doSearch()" />
      <button onclick="doSearch()">搜索</button>
    </div>
  </header>

  <div style="margin-top:calc(var(--nav-h) + 60px); max-width:1280px; margin-left:auto; margin-right:auto; padding:0 20px 16px;">
    <h2 id="searchTitle" style="font-size:1rem;color:var(--text-dim)">正在搜索…</h2>
  </div>

  <div class="page-content" style="padding-top:0">
    <div class="card-grid" id="contentGrid"></div>
    <button class="load-more" id="loadMoreBtn" onclick="loadMore()" style="display:none">加载更多</button>
    <div id="emptyTip" style="display:none;text-align:center;padding:60px 20px;color:var(--text-muted)">
      <div style="font-size:3rem;margin-bottom:12px">🔍</div>
      <div>没有找到相关内容，换个关键词试试</div>
    </div>
  </div>

  <div class="modal-overlay" id="loginModal">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h2>登录 / 注册</h2>
      <input type="text" id="inputUsername" placeholder="用户名" maxlength="16" />
      <input type="password" id="inputPassword" placeholder="密码" maxlength="32" />
      <div class="modal-btns">
        <button onclick="doLogin()">登录</button>
        <button class="btn-reg" onclick="doRegister()">注册</button>
      </div>
    </div>
  </div>
  <div class="modal-overlay" id="settingsModal">
    <div class="modal settings-modal">
      <button class="modal-close" onclick="closeSettings()">✕</button>
      <h2>个人设置</h2>
      <div class="settings-avatar" id="settingsAvatar"></div>
      <div class="setting-item"><label>显示名称</label><input type="text" id="setNickname" placeholder="昵称" /></div>
      <div class="setting-item">
        <label>主题颜色</label>
        <div class="color-picker">
          <span class="color-dot" style="background:#e05c3a" data-color="#e05c3a" onclick="pickColor(this)"></span>
          <span class="color-dot" style="background:#3a7de0" data-color="#3a7de0" onclick="pickColor(this)"></span>
          <span class="color-dot" style="background:#3ac97d" data-color="#3ac97d" onclick="pickColor(this)"></span>
          <span class="color-dot" style="background:#c93a9a" data-color="#c93a9a" onclick="pickColor(this)"></span>
          <span class="color-dot" style="background:#e0b83a" data-color="#e0b83a" onclick="pickColor(this)"></span>
        </div>
      </div>
      <div class="setting-item"><label>界面模式</label>
        <div class="toggle-row">
          <button id="themeDark" onclick="setTheme('dark')">🌙 深色</button>
          <button id="themeLight" onclick="setTheme('light')">☀️ 浅色</button>
        </div>
      </div>
      <div class="setting-item"><label>默认视频源</label>
        <select id="defaultSource">
          <option value="0">线路一（推荐）</option>
          <option value="1">线路二</option>
          <option value="2">线路三</option>
        </select>
      </div>
      <div class="settings-actions">
        <button onclick="saveSettings()">保存设置</button>
        <button class="btn-danger" onclick="doLogout()">退出登录</button>
      </div>
      <div class="watch-history"><h3>观看历史</h3><div id="historyList"></div><button class="btn-clear" onclick="clearHistory()">清除历史</button></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <nav class="mobile-nav">
    <a href="../index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>首页</a>
    <a href="movie.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/></svg>电影</a>
    <a href="tv.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2"/><polyline points="17 2 12 7 7 2"/></svg>剧集</a>
    <a href="anime.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8.56 2.75c4.37 6.03 6.02 9.42 8.03 17.72m2.54-15.38c-3.72 4.35-8.94 5.66-16.88 5.85m19.5 1.9c-3.5-.93-6.63-.82-8.94 0-2.58.92-5.01 2.86-7.44 6.32"/></svg>动漫</a>
    <a href="search.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>搜索</a>
  </nav>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    const urlParams = new URLSearchParams(location.search);
    let keyword = urlParams.get('q') || '';
    let currentPage = 1;
    let allResults = [];

    function buildCard(item) {
      const id=item.vod_id, name=item.vod_name||'', pic=item.vod_pic||'';
      const year=item.vod_year||'', score=item.vod_score||'', type=item.type_name||'';
      return `
        <div class="card" onclick="location.href='detail.html?id=${id}'">
          <div class="card-thumb">
            ${pic?`<img src="${pic}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\"no-img\\">🎬</div>'">`:`<div class="no-img">🎬</div>`}
            ${score?`<span class="card-score">⭐${score}</span>`:''}
            ${type?`<span class="card-tag">${type}</span>`:''}
            <div class="card-play-overlay"><svg viewBox="0 0 24 24" fill="currentColor" width="40" height="40"><path d="M8 5v14l11-7z"/></svg></div>
          </div>
          <div class="card-info">
            <div class="card-title">${name}</div>
            <div class="card-meta">${year}</div>
          </div>
        </div>`;
    }

    async function doSearch() {
      const input = document.getElementById('searchInput');
      const kw = input?.value?.trim() || keyword;
      if (!kw) return;
      keyword = kw;
      history.replaceState(null,'','?q='+encodeURIComponent(kw));
      currentPage = 1;
      document.getElementById('searchTitle').innerHTML =
        `搜索 "<span style="color:var(--accent)">${kw}</span>" 的结果`;
      document.getElementById('contentGrid').innerHTML = `
        <div class="skeleton" style="border-radius:10px"><div class="skeleton" style="aspect-ratio:2/3;border-radius:10px 10px 0 0"></div></div>`.repeat(8);
      document.getElementById('emptyTip').style.display='none';

      try {
        const data = await API.search(kw);
        allResults = data.list || [];
        document.getElementById('contentGrid').innerHTML =
          allResults.length ? allResults.map(buildCard).join('') : '';
        document.getElementById('emptyTip').style.display = allResults.length ? 'none' : 'block';
        document.getElementById('loadMoreBtn').style.display = allResults.length>=20 ? '' : 'none';
      } catch(e) {
        document.getElementById('contentGrid').innerHTML =
          '<p style="color:var(--text-muted);grid-column:1/-1;padding:20px">⚠️ 搜索失败，请重试</p>';
      }
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
      if (keyword) {
        document.getElementById('searchInput').value = keyword;
        doSearch();
      }
    });
  </script>
</body>
</html>
