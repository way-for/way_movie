<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>播放 - 映巢</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    .fav-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--bg3); color: var(--text-dim);
      padding: 8px 18px; border-radius: 8px;
      font-size: 0.88rem; font-weight: 500;
      transition: all var(--transition);
    }
    .fav-btn:hover, .fav-btn.active { background: var(--accent); color: #fff; }
    .info-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr));
      gap: 8px; margin-bottom: 16px;
    }
    .info-item { font-size: 0.82rem; }
    .info-item .label { color: var(--text-muted); margin-bottom: 2px; }
    .info-item .val { color: var(--text-dim); }
    .player-loading {
      position: absolute; inset: 0; background: #000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: var(--text-dim); gap: 12px; font-size: 0.9rem;
    }
    .spinner {
      width: 36px; height: 36px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .source-section { margin-bottom: 20px; }
    .source-section h3 { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 8px; }
  </style>
</head>
<body>
  <header class="navbar" id="navbar">
    <div class="nav-inner">
      <a class="logo" href="../index.html">映<span>巢</span></a>
      <nav class="nav-links">
        <a href="../index.html">首页</a>
        <a href="movie.html">电影</a>
        <a href="tv.html">剧集</a>
        <a href="anime.html">动漫</a>
        <a href="variety.html">综艺</a>
      </nav>
      <div class="nav-right">
        <button class="search-btn" onclick="history.back()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        </button>
        <div id="userArea"></div>
      </div>
    </div>
  </header>

  <div class="player-wrap" id="playerWrap">
    <!-- 左侧主区域 -->
    <div class="player-main">
      <!-- 播放器 -->
      <div class="player-box" id="playerBox">
        <div class="player-loading" id="playerLoading">
          <div class="spinner"></div>
          <span>正在加载视频…</span>
        </div>
        <iframe id="playerFrame" allowfullscreen style="display:none;width:100%;height:100%;border:none;"></iframe>
      </div>

      <!-- 标题信息 -->
      <div style="margin-top:16px">
        <div id="titleArea"></div>
      </div>

      <!-- 线路 & 集数 -->
      <div id="episodeArea"></div>
    </div>

    <!-- 右侧推荐 -->
    <div class="player-sidebar" id="sidebarArea">
      <h3>相关推荐</h3>
      <div id="sidebarList"></div>
    </div>
  </div>

  <!-- 登录弹窗 -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h2>登录 / 注册</h2>
      <p class="modal-sub">登录后可保存观看历史、收藏和偏好设置</p>
      <input type="text" id="inputUsername" placeholder="用户名" maxlength="16" />
      <input type="password" id="inputPassword" placeholder="密码" maxlength="32" />
      <div class="modal-btns">
        <button onclick="doLogin()">登录</button>
        <button class="btn-reg" onclick="doRegister()">注册</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal settings-modal">
      <button class="modal-close" onclick="closeSettings()">✕</button>
      <h2>个人设置</h2>
      <div class="settings-avatar" id="settingsAvatar"></div>
      <div class="setting-item">
        <label>显示名称</label>
        <input type="text" id="setNickname" placeholder="昵称" maxlength="12" />
      </div>
      <div class="setting-item">
        <label>主题颜色</label>
        <div class="color-picker">
          <span class="color-dot" style="background:#e05c3a" data-color="#e05c3a" onclick="pickColor(this)"></span>
          <span class="color-dot" style="background:#3a7de0" data-color="#3a7de0" onclick="pickColor(this)"></span>
          <span class="color-dot" style="background:#3ac97d" data-color="#3ac97d" onclick="pickColor(this)"></span>
          <span class="color-dot" style="background:#c93a9a" data-color="#c93a9a" onclick="pickColor(this)"></span>
          <span class="color-dot" style="background:#e0b83a" data-color="#e0b83a" onclick="pickColor(this)"></span>
        </div>
      </div>
      <div class="setting-item">
        <label>界面模式</label>
        <div class="toggle-row">
          <button id="themeDark" onclick="setTheme('dark')">🌙 深色</button>
          <button id="themeLight" onclick="setTheme('light')">☀️ 浅色</button>
        </div>
      </div>
      <div class="setting-item">
        <label>默认视频源</label>
        <select id="defaultSource">
          <option value="0">线路一（推荐）</option>
          <option value="1">线路二</option>
          <option value="2">线路三</option>
        </select>
      </div>
      <div class="settings-actions">
        <button onclick="saveSettings()">保存设置</button>
        <button class="btn-danger" onclick="doLogout()">退出登录</button>
      </div>
      <div class="watch-history">
        <h3>观看历史</h3>
        <div id="historyList"></div>
        <button class="btn-clear" onclick="clearHistory()">清除历史</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    let currentDetail = null;
    let currentSourceGroup = 0;
    let currentEpIdx = 0;

    const urlParams = new URLSearchParams(location.search);
    const vodId = urlParams.get('id');

    async function loadDetail() {
      if (!vodId) { showToast('缺少视频ID'); return; }

      try {
        const detail = await API.getDetail(vodId);
        currentDetail = detail;

        // 记录历史
        Auth.addHistory({
          id:   detail.vod_id,
          name: detail.vod_name,
          pic:  detail.vod_pic,
          type: detail.type_name,
        });

        document.title = (detail.vod_name || '播放') + ' - 映巢';
        renderTitleArea(detail);
        renderEpisodeArea(detail);
        loadSidebar(detail);

        // 自动播放第一集
        if (detail._parsedUrls?.length > 0) {
          const epUrl = detail._parsedUrls[currentSourceGroup]?.episodes[0]?.url;
          if (epUrl) playEpisode(currentSourceGroup, 0);
        }

      } catch (e) {
        console.error(e);
        document.getElementById('playerBox').innerHTML =
          `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);flex-direction:column;gap:12px;padding:20px;text-align:center">
            <div style="font-size:2rem">⚠️</div>
            <div>视频加载失败，请检查网络或刷新重试</div>
            <button onclick="location.reload()" style="background:var(--accent);color:#fff;padding:8px 20px;border-radius:8px;cursor:pointer">重试</button>
          </div>`;
      }
    }

    function renderTitleArea(detail) {
      const isFav = Auth.isFavorite(detail.vod_id);
      const desc = (detail.vod_content || detail.vod_blurb || '').replace(/<[^>]+>/g, '');
      document.getElementById('titleArea').innerHTML = `
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap">
          <h1 class="player-title">${detail.vod_name || ''}</h1>
          <button class="fav-btn ${isFav?'active':''}" id="favBtn" onclick="toggleFav()">
            ${isFav ? '❤️ 已收藏' : '🤍 收藏'}
          </button>
        </div>
        <div class="info-grid">
          ${detail.vod_year    ? `<div class="info-item"><div class="label">年份</div><div class="val">${detail.vod_year}</div></div>` : ''}
          ${detail.vod_area    ? `<div class="info-item"><div class="label">地区</div><div class="val">${detail.vod_area}</div></div>` : ''}
          ${detail.vod_score   ? `<div class="info-item"><div class="label">评分</div><div class="val">⭐ ${detail.vod_score}</div></div>` : ''}
          ${detail.vod_director? `<div class="info-item"><div class="label">导演</div><div class="val">${detail.vod_director}</div></div>` : ''}
          ${detail.vod_actor   ? `<div class="info-item"><div class="label">主演</div><div class="val">${detail.vod_actor.split(',').slice(0,3).join(' / ')}</div></div>` : ''}
          ${detail.type_name   ? `<div class="info-item"><div class="label">类型</div><div class="val">${detail.type_name}</div></div>` : ''}
        </div>
        ${desc ? `<p class="player-desc">${desc}</p>` : ''}
      `;
    }

    function renderEpisodeArea(detail) {
      const groups = detail._parsedUrls || [];
      if (!groups.length) {
        document.getElementById('episodeArea').innerHTML =
          `<p style="color:var(--text-muted);font-size:0.85rem">暂无播放源</p>`;
        return;
      }

      const tabsHtml = groups.map((g, i) =>
        `<button class="source-tab ${i===0?'active':''}" onclick="switchSource(${i})" id="srcTab${i}">${g.name}</button>`
      ).join('');

      const epGroups = groups.map((g, gi) => `
        <div class="source-section" id="epGroup${gi}" style="${gi===0?'':'display:none'}">
          <div class="episode-label">${g.name} · 共 ${g.episodes.length} 集</div>
          <div class="episodes">
            ${g.episodes.map((ep, ei) =>
              `<button class="ep-btn ${gi===0&&ei===0?'active':''}" id="ep_${gi}_${ei}" onclick="playEpisode(${gi},${ei})">${ep.name}</button>`
            ).join('')}
          </div>
        </div>
      `).join('');

      document.getElementById('episodeArea').innerHTML = `
        <div class="source-tabs">${tabsHtml}</div>
        ${epGroups}
      `;
    }

    function switchSource(gi) {
      currentSourceGroup = gi;
      // 更新tab样式
      document.querySelectorAll('.source-tab').forEach((t, i) => t.classList.toggle('active', i===gi));
      // 显示对应集数组
      document.querySelectorAll('[id^="epGroup"]').forEach((el, i) => {
        el.style.display = i===gi ? '' : 'none';
      });
      // 自动播放当前组第一集
      playEpisode(gi, 0);
    }

    function playEpisode(gi, ei) {
      const groups = currentDetail?._parsedUrls || [];
      const ep = groups[gi]?.episodes[ei];
      if (!ep || !ep.url) { showToast('该集暂无播放地址'); return; }

      currentEpIdx = ei;
      currentSourceGroup = gi;

      // 更新集数按钮样式
      document.querySelectorAll(`[id^="ep_${gi}_"]`).forEach((btn, i) => {
        btn.classList.toggle('active', i===ei);
      });

      // 显示加载中
      const box = document.getElementById('playerBox');
      const loading = document.getElementById('playerLoading');
      const frame = document.getElementById('playerFrame');
      if (loading) loading.style.display = 'flex';
      if (frame)  frame.style.display = 'none';

      // 构建播放URL
      const playerUrl = API.buildPlayerUrl(ep.url);
      setTimeout(() => {
        if (frame) {
          frame.src = playerUrl;
          frame.style.display = 'block';
          frame.onload = () => { if(loading) loading.style.display='none'; };
          // 5秒超时后隐藏loading
          setTimeout(() => { if(loading) loading.style.display='none'; }, 5000);
        }
      }, 300);
    }

    function toggleFav() {
      if (!Auth.isLoggedIn()) { openLogin(); return; }
      const item = {
        id:   currentDetail.vod_id,
        name: currentDetail.vod_name,
        pic:  currentDetail.vod_pic,
      };
      const added = Auth.addFavorite(item);
      const btn = document.getElementById('favBtn');
      if (btn) {
        btn.className = `fav-btn ${added?'active':''}`;
        btn.textContent = added ? '❤️ 已收藏' : '🤍 收藏';
      }
      showToast(added ? '已添加收藏' : '已取消收藏');
    }

    async function loadSidebar(detail) {
      const el = document.getElementById('sidebarList');
      if (!el) return;
      try {
        const data = await API.getList(
          detail.type_id === '1' ? 'movie' : detail.type_id === '2' ? 'tv' : detail.type_id === '4' ? 'anime' : 'variety',
          1
        );
        const items = (data.list || []).filter(i => i.vod_id !== detail.vod_id).slice(0, 10);
        el.innerHTML = items.map(i => `
          <div class="sidebar-card" onclick="location.href='detail.html?id=${i.vod_id}'">
            <div class="sidebar-thumb">
              ${i.vod_pic ? `<img src="${i.vod_pic}" loading="lazy" onerror="this.style.display='none'">` : ''}
            </div>
            <div class="sidebar-info">
              <div class="title">${i.vod_name || ''}</div>
              <div class="meta">${i.vod_year || ''} ${i.vod_remarks || ''}</div>
            </div>
          </div>`).join('');
      } catch(e) {
        el.innerHTML = '<p style="color:var(--text-muted);font-size:0.82rem">推荐加载失败</p>';
      }
    }

    function toDetail(id) { location.href = 'detail.html?id=' + id; }

    document.addEventListener('DOMContentLoaded', () => {
      loadDetail();
    });
  </script>
</body>
</html>
