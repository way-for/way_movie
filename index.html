<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>飘雪 · 影视</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    /* ── Banner 轮播 ── */
    .banner {
      margin-top: var(--nav-h);
      position: relative;
      width: 100%;
      height: min(520px, 56vw);
      overflow: hidden;
      background: #0a0a0f;
    }
    @media(max-width:768px){ .banner { height: 260px; } }

    /* 每一张幻灯片 */
    .banner-slide {
      position: absolute; inset: 0;
      opacity: 0; transition: opacity .7s ease;
      pointer-events: none;
    }
    .banner-slide.active {
      opacity: 1; pointer-events: auto;
    }

    /* 背景图（模糊放大） */
    .banner-bg {
      position: absolute; inset: -10%;
      background-size: cover; background-position: center;
      filter: blur(18px) brightness(.45);
      transform: scale(1.1);
      transition: transform 8s ease;
    }
    .banner-slide.active .banner-bg { transform: scale(1.18); }

    /* 渐变遮罩 */
    .banner-mask {
      position: absolute; inset: 0;
      background: linear-gradient(
        90deg,
        rgba(10,10,15,0.92) 0%,
        rgba(10,10,15,0.5) 45%,
        transparent 70%
      ), linear-gradient(
        to top,
        rgba(10,10,15,0.8) 0%,
        transparent 50%
      );
    }

    /* 海报 */
    .banner-poster {
      position: absolute;
      right: 6%; top: 50%; transform: translateY(-50%);
      width: min(200px, 22vw);
      aspect-ratio: 2/3;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 48px rgba(0,0,0,.7);
      opacity: 0; transition: opacity .5s .3s;
    }
    .banner-slide.active .banner-poster { opacity: 1; }
    .banner-poster img { width:100%; height:100%; object-fit:cover; }
    @media(max-width:768px){ .banner-poster { display:none; } }

    /* 文字内容 */
    .banner-content {
      position: absolute;
      left: max(24px, calc((100% - 1280px)/2 + 24px));
      bottom: 20%; right: 32%;
      opacity: 0; transform: translateY(16px);
      transition: opacity .5s .2s, transform .5s .2s;
    }
    .banner-slide.active .banner-content {
      opacity: 1; transform: translateY(0);
    }
    @media(max-width:768px){
      .banner-content { left:16px; right:16px; bottom:16%; }
    }

    .banner-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--accent); color: #fff;
      font-size: .72rem; font-weight: 700;
      padding: 3px 12px; border-radius: 20px;
      letter-spacing: 1px; margin-bottom: 12px;
      text-transform: uppercase;
    }
    .banner-title {
      font-family: var(--font-display);
      font-size: clamp(1.4rem, 3.5vw, 2.2rem);
      font-weight: 700; line-height: 1.25;
      margin-bottom: 10px;
      text-shadow: 0 2px 12px rgba(0,0,0,.6);
    }
    .banner-meta {
      display: flex; gap: 12px; flex-wrap: wrap;
      align-items: center; margin-bottom: 10px;
    }
    .banner-meta span {
      font-size: .8rem; color: rgba(255,255,255,.7);
    }
    .banner-meta .score {
      color: #ffd700; font-weight: 600;
    }
    .banner-desc {
      font-size: .85rem; color: rgba(255,255,255,.65);
      line-height: 1.7; margin-bottom: 20px;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .banner-btns { display: flex; gap: 10px; flex-wrap: wrap; }
    .banner-btns .btn-play {
      padding: 11px 28px; font-size: .9rem;
    }
    .banner-btns .btn-info {
      padding: 11px 24px; font-size: .9rem;
    }

    /* 指示点 */
    .banner-dots {
      position: absolute; bottom: 16px;
      left: 50%; transform: translateX(-50%);
      display: flex; gap: 7px; z-index: 10;
    }
    .banner-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: rgba(255,255,255,.35);
      cursor: pointer; transition: all .3s;
      border: none; padding: 0;
    }
    .banner-dot.active {
      width: 22px; border-radius: 4px;
      background: var(--accent);
    }

    /* 左右箭头 */
    .banner-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      z-index: 10; width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.18);
      color: #fff; font-size: 1.1rem;
      cursor: pointer; transition: background .2s;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
    }
    .banner-arrow:hover { background: rgba(255,255,255,.25); }
    .banner-arrow.prev { left: 16px; }
    .banner-arrow.next { right: 16px; }
    @media(max-width:768px){
      .banner-arrow { display: none; }
    }

    /* 进度条 */
    .banner-progress {
      position: absolute; bottom: 0; left: 0;
      height: 3px; background: var(--accent);
      width: 0%; transition: width linear;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- 顶部导航 -->
  <header class="navbar" id="navbar">
    <div class="nav-inner">
      <a class="logo" href="index.html">飘<span>雪</span></a>
      <nav class="nav-links">
        <a href="index.html" class="active">首页</a>
        <a href="pages/movie.html">电影</a>
        <a href="pages/tv.html">剧集</a>
        <a href="pages/anime.html">动漫</a>
        <a href="pages/variety.html">综艺</a>
      </nav>
      <div class="nav-right">
        <button class="search-btn" onclick="toggleSearch()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <div id="userArea"></div>
      </div>
    </div>
    <div class="search-bar" id="searchBar">
      <input type="text" id="searchInput" placeholder="搜索电影、剧集、动漫…" onkeydown="if(event.key==='Enter')doSearch()" />
      <button onclick="doSearch()">搜索</button>
      <button class="close-search" onclick="toggleSearch()">✕</button>
    </div>
  </header>

  <main>
    <!-- ── Banner 轮播 ── -->
    <section class="banner" id="banner"
      onmouseenter="pauseBanner()"
      onmouseleave="resumeBanner()">
      <!-- 幻灯片动态插入 -->
      <div id="bannerSlides"></div>

      <!-- 左右箭头 -->
      <button class="banner-arrow prev" onclick="moveBanner(-1)">‹</button>
      <button class="banner-arrow next" onclick="moveBanner(1)">›</button>

      <!-- 指示点 -->
      <div class="banner-dots" id="bannerDots"></div>

      <!-- 进度条 -->
      <div class="banner-progress" id="bannerProgress"></div>
    </section>

    <!-- 内容区 -->
    <div class="content-wrap">

      <section class="row-section">
        <div class="row-head"><h2>🎬 最新电影</h2><a href="pages/movie.html">更多 →</a></div>
        <div class="card-row" id="movieRow"></div>
      </section>

      <section class="row-section">
        <div class="row-head"><h2>📺 热门剧集</h2><a href="pages/tv.html">更多 →</a></div>
        <div class="card-row" id="tvRow"></div>
      </section>

      <section class="row-section">
        <div class="row-head"><h2>✨ 动漫推荐</h2><a href="pages/anime.html">更多 →</a></div>
        <div class="card-row" id="animeRow"></div>
      </section>

      <section class="row-section">
        <div class="row-head"><h2>🎉 综艺节目</h2><a href="pages/variety.html">更多 →</a></div>
        <div class="card-row" id="varietyRow"></div>
      </section>

    </div>
  </main>

  <!-- 登录弹窗 -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h2>登录 / 注册</h2>
      <p class="modal-sub">登录后可保存观看历史、收藏和偏好设置</p>
      <input type="text" id="inputUsername" placeholder="用户名（随意填写）" maxlength="16" />
      <input type="password" id="inputPassword" placeholder="密码（本地存储，无需真实）" maxlength="32" />
      <div class="modal-btns">
        <button onclick="doLogin()">登录</button>
        <button class="btn-reg" onclick="doRegister()">注册</button>
      </div>
      <p class="modal-tip">⚠️ 数据仅保存在本设备</p>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal settings-modal">
      <button class="modal-close" onclick="closeSettings()">✕</button>
      <h2>个人设置</h2>
      <div class="settings-avatar" id="settingsAvatar"></div>
      <div class="setting-item">
        <label>显示名称</label>
        <input type="text" id="setNickname" placeholder="昵称" maxlength="12" />
      </div>
      <div class="setting-item">
        <label>主题风格</label>
        <div id="themePicker"></div>
      </div>
      <div class="setting-item">
        <label>默认视频源</label>
        <select id="defaultSource">
          <option value="0">线路一（推荐）</option>
          <option value="1">线路二</option>
          <option value="2">线路三</option>
          <option value="3">线路四</option>
        </select>
      </div>
      <div class="settings-actions">
        <button onclick="saveSettings()">保存设置</button>
        <button class="btn-danger" onclick="doLogout()">退出登录</button>
      </div>
      <div class="watch-history">
        <h3>观看历史</h3>
        <div id="historyList"></div>
        <button class="btn-clear" onclick="clearHistory()">清除历史</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- 移动端底部导航 -->
  <nav class="mobile-nav">
    <a href="index.html" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>首页
    </a>
    <a href="pages/movie.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/></svg>电影
    </a>
    <a href="pages/tv.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2"/><polyline points="17 2 12 7 7 2"/></svg>剧集
    </a>
    <a href="pages/anime.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8.56 2.75c4.37 6.03 6.02 9.42 8.03 17.72m2.54-15.38c-3.72 4.35-8.94 5.66-16.88 5.85m19.5 1.9c-3.5-.93-6.63-.82-8.94 0-2.58.92-5.01 2.86-7.44 6.32"/></svg>动漫
    </a>
    <a href="pages/search.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>搜索
    </a>
  </nav>

  <footer>
    <p>飘雪 · 内容来源于互联网公开资源 · 仅供个人学习使用</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
